name: agropolia-i0
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: agropolia
      POSTGRES_USER: agropolia
      POSTGRES_PASSWORD: agropolia
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agropolia -d agropolia"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  backend-api:
    build:
      context: ./backend
    env_file: .env
    command: ["uvicorn", "agropolia.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./backend:/app
      - ./tests:/workspace/tests:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "8000:8000"

  backend-worker:
    build:
      context: ./backend
    env_file: .env
    command: ["python", "-m", "agropolia.shared.worker"]
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  client:
    build:
      context: ./apps/client
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./apps/client:/app
      - client-node-modules:/app/node_modules
    depends_on:
      - backend-api
    ports:
      - "5173:5173"

volumes:
  postgres-data:
  nats-data:
  client-node-modules:
