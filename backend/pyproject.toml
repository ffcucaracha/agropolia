[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agropolia-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.128.2","uvicorn[standard]>=0.35,<0.41","pydantic==2.13.4","pydantic-settings==2.14.1","SQLAlchemy==2.0.50","alembic==1.18.4","asyncpg>=0.30,<0.32","redis>=6,<8","nats-py>=2.10,<3","PyJWT==2.13.0"]

[project.optional-dependencies]
test = ["pytest==9.0.2","pytest-asyncio>=0.25,<2","httpx==0.28.1"]

[tool.setuptools.packages.find]
where=["."]
include=["agropolia*"]

[tool.pytest.ini_options]
asyncio_mode="auto"
testpaths=["../tests"]
pythonpath=["."]

[tool.ruff]
target-version="py312"
line-length=100
